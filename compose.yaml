services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta_dev
      POSTGRES_DB: conecta_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-tests.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conecta -d conecta_dev']
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
